name: CI - Validar IaC, Seguridad e Imagen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  terraform-validate:
    name: Terraform fmt y validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, uat, prod]
    steps:
      - name: Descargar repo
        uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Verificar formato IaC
        run: terraform fmt -check -recursive infra/

      - name: Inicializar sin backend y validar (${{ matrix.env }})
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false
          terraform validate

  iac-security-scan:
    name: Escaneo seguridad IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v7

      - name: Escanear configuracion Terraform con Trivy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:latest config \
            --ignorefile /src/.trivyignore \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            infra/

  build-and-scan:
    name: Construir y escanear imagen Docker
    runs-on: ubuntu-latest
    needs: [terraform-validate, iac-security-scan]
    steps:
      - name: Descargar repo
        uses: actions/checkout@v7

      - name: Construir imagen local para escaneo
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: traccar-local:${{ github.sha }}

      - name: Escanear vulnerabilidades de la imagen (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:latest image \
            --scanners vuln \
            --ignorefile /src/.trivyignore \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            traccar-local:${{ github.sha }}

      - name: Login en GHCR (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen inmutable por SHA en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
