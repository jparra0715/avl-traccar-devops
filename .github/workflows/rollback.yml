name: Rollback - Prod Traccar

on:
  workflow_dispatch:
    inputs:
      target_image_tag:
        description: "SHA inmutable anterior de la imagen en GHCR (ej. 63fc7a6...)"
        required: true
        type: string
      reason:
        description: "Motivo del rollback"
        required: true
        default: "Incidente en nueva version - retorno a version estable"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback-prod:
    name: Ejecutar rollback en PROD (Requiere aprobacion)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar artefacto anterior y ejecutar smoke test de recuperacion
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.target_image_tag }}"
          echo "Motivo del rollback: ${{ inputs.reason }}"
          echo "Artefacto estable destino: $IMAGE"
          echo "Comando operativo en host Floci: ./scripts/rollback-prod.sh --image $IMAGE"

          docker pull "$IMAGE"
          docker network create rb-prod
          docker run -d --name pg-rb --network rb-prod \
            -e POSTGRES_DB=traccar_prod -e POSTGRES_USER=traccar -e POSTGRES_PASSWORD=smokepass \
            postgres:16-alpine

          for i in $(seq 1 20); do
            docker exec pg-rb pg_isready -U traccar -d traccar_prod && break
            sleep 2
          done

          docker run -d --name app-rb --network rb-prod -p 18084:8082 \
            -e CONFIG_USE_ENVIRONMENT_VARIABLES=true \
            -e DATABASE_DRIVER=org.postgresql.Driver \
            -e DATABASE_URL=jdbc:postgresql://pg-rb:5432/traccar_prod \
            -e DATABASE_USER=traccar \
            -e DATABASE_PASSWORD=smokepass \
            -e LOGGER_CONSOLE=true \
            "$IMAGE"

          ./scripts/smoke-test.sh http://localhost:18084 30 3

      - name: Limpiar contenedores de validacion
        if: always()
        run: |
          docker rm -f app-rb pg-rb 2>/dev/null || true
          docker network rm rb-prod 2>/dev/null || true
