<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0f172a"/>
  <text x="600" y="38" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">AVL Traccar - Arquitectura Multi-Ambiente (Dev / UAT / Prod) + CI/CD + Observabilidad</text>
  <text x="600" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">Terraform IaC | Floci AWS Local (:4566) | GitHub Actions + Trivy + GHCR (SHA) | Prometheus + OTel Collector + Loki + Grafana</text>

  <rect x="30" y="80" width="1140" height="125" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="50" y="104" fill="#38bdf8" font-size="14" font-weight="bold">1. GOBIERNO, CI/CD Y SEGURIDAD (GitHub Actions + GitHub Secrets + Dependabot)</text>

  <rect x="50" y="118" width="195" height="70" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="147" y="142" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PR a main protegida</text>
  <text x="147" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle">5 checks obligatorios</text>
  <text x="147" y="176" fill="#94a3b8" font-size="10" text-anchor="middle">Dependabot (8 PRs activos)</text>

  <rect x="280" y="118" width="230" height="70" rx="8" fill="#0f172a" stroke="#22c55e"/>
  <text x="395" y="140" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">CI (ci.yml) + Trivy</text>
  <text x="395" y="158" fill="#cbd5e1" font-size="11" text-anchor="middle">tf fmt/validate (dev/uat/prod)</text>
  <text x="395" y="174" fill="#94a3b8" font-size="10" text-anchor="middle">Scan IaC + Imagen -&gt; Push GHCR :SHA</text>

  <rect x="545" y="118" width="190" height="70" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="640" y="140" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">GHCR (Imagen Inmutable)</text>
  <text x="640" y="158" fill="#cbd5e1" font-size="11" text-anchor="middle">Misma imagen :GITHUB_SHA</text>
  <text x="640" y="174" fill="#94a3b8" font-size="10" text-anchor="middle">Sin recompilar entre ambientes</text>

  <rect x="770" y="118" width="185" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="862" y="140" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="middle">CD (cd.yml)</text>
  <text x="862" y="158" fill="#cbd5e1" font-size="11" text-anchor="middle">Dev -&gt; Smoke -&gt; UAT</text>
  <text x="862" y="174" fill="#94a3b8" font-size="10" text-anchor="middle">GitHub Secrets fuera de Git</text>

  <rect x="985" y="118" width="165" height="70" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="1067" y="140" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Aprobacion Manual</text>
  <text x="1067" y="158" fill="#fde68a" font-size="11" text-anchor="middle">GitHub Env: prod</text>
  <text x="1067" y="174" fill="#fcd34d" font-size="10" text-anchor="middle">+ rollback.yml (&lt;5 min)</text>

  <line x1="245" y1="153" x2="280" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <line x1="510" y1="153" x2="545" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <line x1="735" y1="153" x2="770" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <line x1="955" y1="153" x2="985" y2="153" stroke="#f59e0b" stroke-width="2"/>

  <rect x="30" y="225" width="760" height="350" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="50" y="250" fill="#4ade80" font-size="14" font-weight="bold">2. INFRAESTRUCTURA IaC EN FLOCI (AWS Local :4566 | Modulo unico infra/modules/traccar)</text>

  <rect x="50" y="264" width="720" height="46" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="410" y="284" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="middle">Proxy Nginx (traccar-proxy, red bridge Docker) + Simulador GPS OsmAnd (scripts/simulate-gps.sh)</text>
  <text x="410" y="301" fill="#cbd5e1" font-size="11" text-anchor="middle">Web/API: :8082 (Dev) | :8083 (UAT) | :8084 (Prod)   ||   GPS OsmAnd: :5055 (Dev) | :5056 (UAT) | :5057 (Prod)</text>

  <rect x="50" y="326" width="225" height="175" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="162" y="348" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Ambiente DEV</text>
  <text x="162" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">Estado: s3://avl-traccar-tfstate/dev</text>
  <rect x="65" y="378" width="195" height="34" rx="5" fill="#1e293b" stroke="#38bdf8"/>
  <text x="162" y="399" fill="#f8fafc" font-size="11" text-anchor="middle">ECS: traccar-dev (:8082 / :5055)</text>
  <rect x="65" y="420" width="195" height="34" rx="5" fill="#1e293b" stroke="#22c55e"/>
  <text x="162" y="441" fill="#f8fafc" font-size="11" text-anchor="middle">RDS PostgreSQL 16 (privado + cifrado)</text>
  <rect x="65" y="462" width="195" height="28" rx="5" fill="#1e293b" stroke="#a855f7"/>
  <text x="162" y="480" fill="#cbd5e1" font-size="10" text-anchor="middle">S3: avl-traccar-backups-dev (PAB)</text>

  <rect x="297" y="326" width="225" height="175" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="409" y="348" fill="#7dd3fc" font-size="13" font-weight="bold" text-anchor="middle">Ambiente UAT</text>
  <text x="409" y="366" fill="#94a3b8" font-size="10" text-anchor="middle">Estado: s3://avl-traccar-tfstate/uat</text>
  <rect x="312" y="378" width="195" height="34" rx="5" fill="#1e293b" stroke="#38bdf8"/>
  <text x="409" y="399" fill="#f8fafc" font-size="11" text-anchor="middle">ECS: traccar-uat (:8083 / :5056)</text>
  <rect x="312" y="420" width="195" height="34" rx="5" fill="#1e293b" stroke="#22c55e"/>
  <text x="409" y="441" fill="#f8fafc" font-size="11" text-anchor="middle">RDS PG16 + Base restore_test</text>
  <rect x="312" y="462" width="195" height="28" rx="5" fill="#1e293b" stroke="#a855f7"/>
  <text x="409" y="480" fill="#cbd5e1" font-size="10" text-anchor="middle">S3: avl-traccar-backups-uat (PAB)</text>

  <rect x="545" y="326" width="225" height="175" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="657" y="348" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">Ambiente PROD</text>
  <text x="657" y="366" fill="#bbf7d0" font-size="10" text-anchor="middle">Estado: s3://avl-traccar-tfstate/prod</text>
  <rect x="560" y="378" width="195" height="34" rx="5" fill="#14532d" stroke="#4ade80"/>
  <text x="657" y="399" fill="#f8fafc" font-size="11" text-anchor="middle">ECS: traccar-prod (:8084 / :5057)</text>
  <rect x="560" y="420" width="195" height="34" rx="5" fill="#14532d" stroke="#4ade80"/>
  <text x="657" y="441" fill="#f8fafc" font-size="11" text-anchor="middle">RDS PostgreSQL 16 (privado + cifrado)</text>
  <rect x="560" y="462" width="195" height="28" rx="5" fill="#14532d" stroke="#fbbf24"/>
  <text x="657" y="480" fill="#fde68a" font-size="10" text-anchor="middle">S3: avl-traccar-backups-prod (PAB)</text>

  <rect x="50" y="514" width="720" height="46" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="410" y="534" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Operacion Prod: Backups pg_dump -&gt; S3 | Restauracion verificada (48 tablas en 5s) | Rollback ECS (46s &lt; 5 min)</text>
  <text x="410" y="551" fill="#cbd5e1" font-size="10" text-anchor="middle">Secretos: fuera de Git y de imagen (variables runtime / GitHub Secrets) | Remote State aislado por ambiente en S3 Floci</text>

  <rect x="810" y="225" width="360" height="350" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="830" y="250" fill="#c084fc" font-size="14" font-weight="bold">3. OBSERVABILIDAD (docker-compose.obs)</text>

  <rect x="830" y="268" width="320" height="54" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="990" y="289" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="middle">Blackbox Exporter (:9115)</text>
  <text x="990" y="307" fill="#cbd5e1" font-size="10" text-anchor="middle">Disponibilidad y latencia /api/server (dev/uat/prod)</text>

  <rect x="830" y="334" width="320" height="58" rx="6" fill="#0f172a" stroke="#22c55e"/>
  <text x="990" y="355" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">OpenTelemetry Collector (:8889)</text>
  <text x="990" y="372" fill="#cbd5e1" font-size="10" text-anchor="middle">Receptor docker_stats via /var/run/docker.sock</text>
  <text x="990" y="385" fill="#94a3b8" font-size="9" text-anchor="middle">(Reemplaza cAdvisor por incompatibilidad overlayfs)</text>

  <rect x="830" y="404" width="320" height="48" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="990" y="424" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Prometheus (:9090) + Alertmanager (:9093)</text>
  <text x="990" y="440" fill="#cbd5e1" font-size="10" text-anchor="middle">Reglas: TraccarProdDown (firing ~50s), Latencia, RAM</text>

  <rect x="830" y="464" width="320" height="44" rx="6" fill="#0f172a" stroke="#e879f9"/>
  <text x="990" y="483" fill="#f0abfc" font-size="12" font-weight="bold" text-anchor="middle">Promtail + Loki (:3100)</text>
  <text x="990" y="499" fill="#cbd5e1" font-size="10" text-anchor="middle">Logs centralizados de contenedores Traccar y RDS</text>

  <rect x="830" y="518" width="320" height="44" rx="6" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
  <text x="990" y="537" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Grafana (:3000) - Dashboard como codigo</text>
  <text x="990" y="553" fill="#e9d5ff" font-size="10" text-anchor="middle">Disponibilidad, Latencia/Errores, CPU/RAM y Logs</text>

  <rect x="30" y="595" width="1140" height="140" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="50" y="622" fill="#f8fafc" font-size="13" font-weight="bold">FLUJOS CRITICOS VERIFICADOS EN PRUEBAS REALES</text>
  <text x="50" y="646" fill="#cbd5e1" font-size="12">- Promocion inmutable: PR -&gt; CI (5 checks + Trivy) -&gt; GHCR :SHA -&gt; CD Dev (smoke) -&gt; UAT (smoke) -&gt; Aprobacion manual -&gt; Prod.</text>
  <text x="50" y="668" fill="#cbd5e1" font-size="12">- Telemetria AVL: simulate-gps.sh registra AVL-FINANZAUTO-001 via API (:8084), envia OsmAnd (:5057) y valida filas en tc_positions.</text>
  <text x="50" y="690" fill="#cbd5e1" font-size="12">- Continuidad y DR: backup-prod.sh sube .sql.gz a S3; restore-backup.sh restaura 48 tablas en 5s; rollback-prod.sh recupera Prod en 46s.</text>
  <text x="50" y="712" fill="#cbd5e1" font-size="12">- Alertamiento: test-alert-prod.sh detiene Prod, dispara TraccarProdDown en Prometheus/Alertmanager (~50s), recupera servicio y resuelve alerta.</text>
</svg>
