receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_constant_labels:
      included: ["*"]

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      exporters: [prometheus]
